[package]
name = "klave-connector-test-utils"
version = "0.1.0"
license = "MIT"
edition = "2021"
repository = "https://github.com/secretarium/devsuite-rust.git"
description = "Test utilities for klave-connector and crates built on it: a mock node playing the server side of SCP"
publish = false

[dependencies]
klave-connector = { path = "../connector" }
tokio = { version = "1", features = ["net", "rt"] }
tokio-tungstenite = "0.21"
futures = "0.3.31"
base64 = "0.21"
rand = "0.8"
aes-gcm = "0.10"
p256 = { version = "0.13", features = ["ecdh"] }
elliptic-curve = "0.13"
